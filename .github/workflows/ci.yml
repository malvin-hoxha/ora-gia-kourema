name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://oragiakourema_test:oragiakourema_test@localhost:5433/oragiakourema_test?schema=public
      DIRECT_URL: postgresql://oragiakourema_test:oragiakourema_test@localhost:5433/oragiakourema_test?schema=public
      DATABASE_URL_TEST: postgresql://oragiakourema_test:oragiakourema_test@localhost:5433/oragiakourema_test?schema=public
      DATABASE_URL_DEVELOPMENT: postgresql://oragiakourema_dev:oragiakourema_dev@localhost:5432/oragiakourema_dev?schema=public
      PORT: 4000
      FRONTEND_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      TRUST_PROXY: false
      BARBERSHOP_TIME_ZONE: Europe/Athens
      JWT_ACCESS_SECRET: test_access_secret_that_is_long_enough_for_ci
      JWT_REFRESH_SECRET: test_refresh_secret_that_is_long_enough_for_ci
      ACCESS_TOKEN_EXPIRES_MINUTES: 15
      REFRESH_TOKEN_EXPIRES_DAYS: 30
      GOOGLE_CLIENT_ID: 000000000000-test.apps.googleusercontent.com
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_CURRENCY: eur
      STRIPE_CHECKOUT_EXPIRES_MINUTES: 30
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      EMAIL_ENABLED: false
      EMAIL_PROVIDER: console
      EMAIL_FROM_NAME: OraGiaKourema
      EMAIL_FROM_ADDRESS: appointments@example.com
      RESEND_API_KEY: ""
      VITE_API_URL: /api
      VITE_GOOGLE_CLIENT_ID: 000000000000-test.apps.googleusercontent.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start test database
        run: npm run test:db:up

      - name: Migrate test database
        run: npm run test:db:migrate

      - name: API typecheck
        run: npm run typecheck --workspace=apps/api

      - name: API test typecheck
        run: npm run typecheck:test --workspace=apps/api

      - name: API integration tests
        run: npm run test:integration --workspace=apps/api

      - name: Web tests
        run: npm run test --workspace=apps/web

      - name: Web test typecheck
        run: npm run typecheck:test --workspace=apps/web

      - name: Web lint
        run: npm run lint --workspace=apps/web

      - name: Web build
        run: npm run build --workspace=apps/web

      - name: API build
        run: npm run build --workspace=apps/api

      - name: Stop test database
        if: always()
        run: npm run test:db:down